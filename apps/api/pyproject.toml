[project]
name = "expensewise-api"
version = "1.0.0"
description = "ExpenseWise API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2",
  "pydantic-settings>=2",
  "argon2-cffi>=23",
  "pyjwt>=2.10",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "openpyxl>=3.1",
  "email-validator>=2.2",
  "mcp>=1.30.0,<1.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
